{% extends 'main/base.html' %}

{% block content %}
<div class="quiz">
    <div class="quiz__container">
        <section class="question-screen" id="quiz-screen">
            <form method="post" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="question-screen__answers">
                    <div class="question-screen__header">
                        <div class="question-screen__counter" id="question-counter">
                            Вопросы {{ start_idx + 1 }} из {{ total_count }}
                        </div>
                        <div class="progress-bar">
                            <div class="progress-bar__fill" id="progress-fill"
                                 style="width: {{ ((current_page + 1) / total_pages * 100)|round }}%"></div>
                        </div>
                    </div>
                    <div class="answers__container" id="answers-container">
                        {% for question in questions %}
                        <div class="answer-item">
                            <div class="answer-item__content">
                                <span class="answer-item__number">{{ start_idx + loop.index }}.</span>
                                <span class="answer-item__text">{{ question.text }}</span>
                            </div>
                            <div class="answer-item__controls">
                                {% for option in question.options|sort(attribute='sort_order') %}
                                <input
                                        type="radio"
                                        class="answer-item__radio"
                                        value="{{ option.label }}"
                                        name="question_{{ question.id }}"
                                        id="q{{ question.id }}_opt{{ option.id }}"
                                        required>

                                <label class="answer-item__label"
                                       for="q{{ question.id }}_opt{{ option.id }}">
                                    {{ option.value }}
                                </label>
                                {% endfor %}
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    <button type="submit" class="question-screen__button">
                        {% if current_page + 1 == total_pages %}
                        <span class="question-screen-text">Завершить тест</span>
                        {% else %}
                        <span class="question-screen-text">Далее</span>
                        {% endif %}
                         <svg  class="animate-spin" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M136,32V64a8,8,0,0,1-16,0V32a8,8,0,0,1,16,0Zm88,88H192a8,8,0,0,0,0,16h32a8,8,0,0,0,0-16Zm-45.09,47.6a8,8,0,0,0-11.31,11.31l22.62,22.63a8,8,0,0,0,11.32-11.32ZM128,184a8,8,0,0,0-8,8v32a8,8,0,0,0,16,0V192A8,8,0,0,0,128,184ZM77.09,167.6,54.46,190.22a8,8,0,0,0,11.32,11.32l22.62-22.63a8,8,0,0,0-11.31-11.31ZM72,128a8,8,0,0,0-8-8H32a8,8,0,0,0,0,16H64A8,8,0,0,0,72,128ZM65.78,54.46A8,8,0,0,0,54.46,65.78L77.09,88.4A8,8,0,0,0,88.4,77.09Z"></path></svg>
                    </button>
                </div>
            </form>
        </section>
    </div>
</div>
{% endblock %}
